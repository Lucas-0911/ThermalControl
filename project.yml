name: ThermalControl
options:
  bundleIdPrefix: com.thermalcontrol
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
schemes:
  ThermalControl:
    build:
      targets:
        ThermalControl: all
        ThermalControlHelper: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThermalControlTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
settings:
  SWIFT_VERSION: "5.10"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_STYLE: Automatic
  CODE_SIGN_IDENTITY: "Apple Development"
  DEVELOPMENT_TEAM: M9GD64VJ5R
  ENABLE_HARDENED_RUNTIME: YES
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ThermalControl:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thermalcontrol.app
      PRODUCT_NAME: Thermal Control
      PRODUCT_MODULE_NAME: ThermalControl
      INFOPLIST_FILE: App/Info.plist
      CODE_SIGN_ENTITLEMENTS: App/ThermalControl.entitlements
      GENERATE_INFOPLIST_FILE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ThermalControlHelper
        embed: false
    postBuildScripts:
      - name: Embed helper
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/ThermalControlHelper
          - $(SRCROOT)/Helper/com.thermalcontrol.helper.plist
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(FULL_PRODUCT_NAME)/Contents/MacOS/ThermalControlHelper
          - $(BUILT_PRODUCTS_DIR)/$(FULL_PRODUCT_NAME)/Contents/Library/LaunchDaemons/com.thermalcontrol.helper.plist
        script: |
          set -euo pipefail
          DEST="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}/Contents/MacOS"
          DAEMON="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}/Contents/Library/LaunchDaemons"
          mkdir -p "$DEST" "$DAEMON"
          HELPER="${TARGET_BUILD_DIR}/ThermalControlHelper"
          if [ ! -f "$HELPER" ]; then
            HELPER="${BUILT_PRODUCTS_DIR}/ThermalControlHelper"
          fi
          if [ ! -f "$HELPER" ]; then
            echo "error: ThermalControlHelper not found" >&2
            exit 1
          fi
          /bin/cp -f "$HELPER" "$DEST/ThermalControlHelper"
          /bin/cp -f "${SRCROOT}/Helper/com.thermalcontrol.helper.plist" "$DAEMON/com.thermalcontrol.helper.plist"
          ICNS="${SRCROOT}/App/Resources/AppIcon.icns"
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
          if [ -f "$ICNS" ]; then
            /bin/cp -f "$ICNS" "$RES"
          fi
          RESDIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$RESDIR"
          if [ -f "${SRCROOT}/Scripts/install_helper.sh" ]; then
            /bin/cp -f "${SRCROOT}/Scripts/install_helper.sh" "$RESDIR/install_helper.sh"
          fi

  ThermalControlHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thermalcontrol.helper
      PRODUCT_NAME: ThermalControlHelper
      INFOPLIST_FILE: Helper/Info.plist
      CODE_SIGN_ENTITLEMENTS: Helper/ThermalControlHelper.entitlements
      GENERATE_INFOPLIST_FILE: NO
      CREATE_INFOPLIST_SECTION_IN_BINARY: YES
      SKIP_INSTALL: NO

  ThermalControlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ThermalControl
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thermalcontrol.tests
      PRODUCT_NAME: ThermalControlTests
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Thermal Control.app/Contents/MacOS/Thermal Control
      BUNDLE_LOADER: $(TEST_HOST)
